<div class="page" id="cakes-page">
    <div class="page-hero shell">
        <div class="eyebrow">The cake collection</div>
        <h1 class="section-title">Pick your perfect slice.</h1>
        <p class="subtext">Our signature cakes, ready to personalise for your celebration. Prices shown are starting
            prices.</p>
        <div class="filter-row"><button class="filter active" data-filter="all">All cakes</button>
            <button class="filter" data-filter="anniversary">Anniversary</button>
            <button class="filter" data-filter="birthday">Birthday</button>
            <button class="filter" data-filter="christmas">Christmas</button>
            <button class="filter" data-filter="cupcake">Cupcake</button>
            <button class="filter" data-filter="engagement">Engagement</button>
            <button class="filter" data-filter="graduation">Graduation</button>
            <button class="filter" data-filter="number">Number cakes</button>
            <button class="filter" data-filter="party">Party</button>
            <button class="filter" data-filter="wedding">Wedding</button>
            <label class="sort-control" for="priceSort">Sort by
                <select id="priceSort">
                    <option value="default">Featured</option>
                    <option value="new">New</option>
                    <option value="low-high">Price: Low to high</option>
                    <option value="high-low">Price: High to low</option>
                </select>
            </label>
        </div>
    </div>
    <div class="shell">
        <div class="product-grid" id="allProducts"></div>
    </div>
    <section class="cta-band shell">
        <div class="cta-inner">
            <div class="cta-content">
                <h2>Have something else in mind?</h2>
                <p>We love turning wild ideas into delicious reality.</p>
                <button class="btn btn-light" data-scroll="order">Create a custom cake →</button>
            </div>
        </div>
    </section>
</div>
