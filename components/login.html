<div class="page" id="login-page">
    <div class="auth-page">
        <div class="shell">

            <!-- Page hero -->
            <div class="auth-hero center">
                <div class="eyebrow" id="authHeroEyebrow">Welcome back</div>
                <h1 class="section-title" id="authHeroTitle">Log in to KúkiCakes.</h1>
                <p class="subtext" id="authHeroSubtext">Access your saved orders, addresses, and custom cake inquiries.</p>
            </div>

            <!-- Login card -->
            <div class="auth-card">

                <!-- 1. LOGIN FORM SECTION -->
                <div id="loginFormSection">
                    <form id="loginForm" novalidate>

                        <!-- Email -->
                        <div class="field">
                            <label for="li-email">Email Address *</label>
                            <input
                                id="li-email"
                                name="email"
                                type="email"
                                placeholder="amaya@email.com"
                                autocomplete="email"
                                required
                            >
                            <span class="field-error" id="li-email-err" aria-live="polite"></span>
                        </div>

                        <!-- Password -->
                        <div class="field" style="margin-top:16px">
                            <label for="li-password">Password *</label>
                            <div class="password-wrap">
                                <input
                                    id="li-password"
                                    name="password"
                                    type="password"
                                    placeholder="Your password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button type="button" class="password-toggle" aria-label="Show password">👁</button>
                            </div>
                            <span class="field-error" id="li-password-err" aria-live="polite"></span>
                        </div>

                        <!-- Remember me + Forgot password -->
                        <div class="form-check">
                            <label>
                                <input type="checkbox" id="li-remember" name="remember">
                                Remember me
                            </label>
                            <button type="button" class="form-check-right" id="forgotPasswordBtn">Forgot Password?</button>
                        </div>

                        <!-- Submit -->
                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="loginSubmitBtn"
                            style="width:100%"
                        >
                            Log In →
                        </button>

                    </form>

                    <!-- Link to sign up -->
                    <p class="auth-links">
                        Don't have an account? <a href="#signup" data-page="signup">Sign up →</a>
                    </p>
                </div>

                <!-- 2. FORGOT PASSWORD SECTION -->
                <div id="forgotPasswordSection" hidden>
                    <div style="margin-bottom:18px;">
                        <h2 style="font-size:18px;font-family:var(--font-heading);color:var(--berry);margin-bottom:6px;">Reset Your Password</h2>
                        <p style="font-size:13px;color:var(--muted);margin:0;line-height:1.5;">Enter the email address associated with your KúkiCakes account and we'll generate password reset instructions.</p>
                    </div>

                    <form id="forgotPasswordForm" novalidate>
                        <div class="field">
                            <label for="fp-email">Email Address *</label>
                            <input
                                id="fp-email"
                                name="email"
                                type="email"
                                placeholder="Enter your registered email"
                                autocomplete="email"
                                required
                            >
                            <span class="field-error" id="fp-email-err" aria-live="polite"></span>
                        </div>

                        <!-- Status & Dev token link box -->
                        <div id="fp-status-box" hidden style="margin-top:14px;background:var(--peach-2);border:1px solid var(--peach);border-radius:12px;padding:14px;font-size:13px;line-height:1.5;"></div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="fpSubmitBtn"
                            style="width:100%;margin-top:16px;"
                        >
                            Send Reset Link →
                        </button>

                        <p class="auth-links" style="margin-top:18px;">
                            Remembered your password? <button type="button" id="fpBackToLoginBtn" style="background:none;border:none;color:var(--berry);font-weight:700;cursor:pointer;text-decoration:underline;">Back to Log In →</button>
                        </p>
                    </form>
                </div>

            </div><!-- /.auth-card -->
        </div><!-- /.shell -->
    </div><!-- /.auth-page -->
</div><!-- /.page #login-page -->
